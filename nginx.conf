# ===================================
# إعداد Nginx لموقع حل المنهج - HalManhaj
# ===================================
# انسخ هذا الملف إلى: /etc/nginx/sites-available/halmanhaj
# ثم فعّله: sudo ln -s /etc/nginx/sites-available/halmanhaj /etc/nginx/sites-enabled/
# ثم أعد تشغيل: sudo nginx -t && sudo systemctl reload nginx

# ===== تحويل HTTP إلى HTTPS =====
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # شهادة Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== HTTPS Server =====
server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── شهادات SSL (Let's Encrypt) ──
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # ── إعدادات عامة ──
    client_max_body_size 200M;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── مسار المشروع ──
    set $project_root /var/www/halmanhaj;

    # ── Sitemap → API ──
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/api/public/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    # ── API → Node.js (PM2) ──
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── ملفات الرفع (uploads) ──
    location /uploads/ {
        alias $project_root/server/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;

        # أنواع الملفات المسموحة
        location ~* \.(pdf|jpg|jpeg|png|gif|webp|svg|ico)$ {
            expires 30d;
        }
    }

    # ── ملفات React الثابتة (JS, CSS, media) ──
    location /static/ {
        alias $project_root/client/build/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── React Build (favicon, manifest, etc) ──
    location ~* \.(ico|json|txt|webmanifest)$ {
        root $project_root/client/build;
        expires 1d;
        access_log off;
    }

    # ── SPA Fallback → React index.html ──
    location / {
        root $project_root/client/build;
        try_files $uri $uri/ /index.html;

        # كاش خفيف لـ index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ── حماية الملفات الحساسة ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(node_modules|\.env|\.git) {
        deny all;
        return 404;
    }

    # ── سجلات ──
    access_log /var/log/nginx/halmanhaj_access.log;
    error_log /var/log/nginx/halmanhaj_error.log;
}
