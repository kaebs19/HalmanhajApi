    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:site_name" content="حل المنهج" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- DNS prefetch & preconnect -->
    <link rel="dns-prefetch" href="https://www.halmanhaj.com" />

    <!-- Preload fonts for performance -->
    <link rel="preload" href="%PUBLIC_URL%/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/fonts/cairo-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Self-hosted Cairo Font + Critical CSS -->
    <style>
      @font-face { font-family: 'Cairo'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('%PUBLIC_URL%/fonts/cairo-arabic.woff2') format('woff2'); unicode-range: U+0600-06FF, U+200C-200D, U+FE70-FEFF; }
      @font-face { font-family: 'Cairo'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('%PUBLIC_URL%/fonts/cairo-latin.woff2') format('woff2'); unicode-range: U+0000-007F, U+00A0-00FF, U+2000-206F; }
      *{font-family:'Cairo','Apple Color Emoji','Segoe UI Emoji',sans-serif!important;margin:0;padding:0;box-sizing:border-box}
      body{direction:rtl;background:#fff}
      #root{min-height:100vh;display:flex;flex-direction:column}
    </style>

    <title>حل المنهج - حلول المناهج الدراسية السعودية</title>
  </head>
  <body>
    <noscript>يجب تفعيل JavaScript لتشغيل هذا التطبيق.</noscript>
    <div id="root">
      <!-- Inline skeleton to prevent CLS (replaced by React on mount) -->
      <style>
        .sk{background:#e5e7eb;border-radius:1rem;animation:sk-pulse 2s cubic-bezier(.4,0,.6,1) infinite}
        @keyframes sk-pulse{50%{opacity:.5}}
        .sk-wrap{max-width:80rem;margin:0 auto;padding:0 1rem}
        .sk-stages{display:grid;gap:.75rem;padding-top:1.5rem;padding-bottom:1rem;min-height:312px}
        .sk-stage{height:88px;border-radius:1rem}
        .sk-grades{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;padding-bottom:1.5rem}
        .sk-grade{height:80px;border-radius:.75rem;border:1px solid #f3f4f6;background:#fff}
        .sk-grade-inner{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:.75rem}
        .sk-grade-icon{width:2.25rem;height:2.25rem;border-radius:.5rem}
        .sk-grade-text{height:.75rem;width:3.5rem;border-radius:.25rem}
        @media(min-width:640px){
          .sk-stages{grid-template-columns:repeat(3,1fr);min-height:120px}
          .sk-stage{height:96px}
          .sk-grades{grid-template-columns:repeat(4,1fr)}
        }
        @media(min-width:768px){.sk-grades{grid-template-columns:repeat(6,1fr)}}
        @media(min-width:1024px){.sk-grades{grid-template-columns:repeat(8,1fr)}}
      </style>
      <div class="sk-wrap">
        <div class="sk-stages">
          <div class="sk sk-stage"></div>
          <div class="sk sk-stage"></div>
          <div class="sk sk-stage"></div>
        </div>
        <div class="sk-grades">
          <div class="sk-grade"><div class="sk-grade-inner"><div class="sk sk-grade-icon"></div><div class="sk sk-grade-text"></div></div></div>
          <div class="sk-grade"><div class="sk-grade-inner"><div class="sk sk-grade-icon"></div><div class="sk sk-grade-text"></div></div></div>
          <div class="sk-grade"><div class="sk-grade-inner"><div class="sk sk-grade-icon"></div><div class="sk sk-grade-text"></div></div></div>
          <div class="sk-grade"><div class="sk-grade-inner"><div class="sk sk-grade-icon"></div><div class="sk sk-grade-text"></div></div></div>
          <div class="sk-grade"><div class="sk-grade-inner"><div class="sk sk-grade-icon"></div><div class="sk sk-grade-text"></div></div></div>
          <div class="sk-grade"><div class="sk-grade-inner"><div class="sk sk-grade-icon"></div><div class="sk sk-grade-text"></div></div></div>
        </div>
      </div>
    </div>
  </body>
</html>
